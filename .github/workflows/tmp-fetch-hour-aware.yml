name: Temporary hour-aware public-data research

on:
  push:
    branches: [tmp-hour-aware-data-fetch]
    paths:
      - .github/workflows/tmp-fetch-hour-aware.yml
      - .tmp-hour-aware-fetch-trigger

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-hour-aware-data-fetch

      - name: Download and checksum-validate public dataset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp-research-data/hour-aware
          python3 - <<'PY'
          import csv, hashlib, json, pathlib, time, urllib.request
          base = "https://zenodo.org/records/20043302/files"
          expected = {
              "trades.csv": ("b3a4c482547a48063319f0a420cb2217", 190),
              "rejection_outcomes.csv": ("14df5782fd258ce1e13a98b1d96790e0", 4874),
              "scanner_2026-04-09.csv": ("613e30eb2e0305a8e1c85f89a9b0d8c2", 2969),
              "scanner_2026-04-10.csv": ("f925382bba08e80f34d6f209dd7713a6", 4367),
          }
          out = pathlib.Path("tmp-research-data/hour-aware")
          manifest = {"source": "https://zenodo.org/records/20043302", "doi": "10.5281/zenodo.20043302", "files": {}}
          for name, (md5_expected, rows_expected) in expected.items():
              target = out / name
              url = f"{base}/{name}?download=1"
              if not target.exists() or hashlib.md5(target.read_bytes()).hexdigest() != md5_expected:
                  for attempt in range(7):
                      try:
                          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 reproducible-research"})
                          with urllib.request.urlopen(req, timeout=120) as response:
                              target.write_bytes(response.read())
                          break
                      except Exception:
                          if attempt == 6: raise
                          time.sleep(min(60, 2 ** attempt))
              digest = hashlib.md5(target.read_bytes()).hexdigest()
              if digest != md5_expected: raise SystemExit(f"md5 mismatch {name}: {digest}")
              with target.open(newline="", encoding="utf-8-sig") as handle:
                  rows = sum(1 for _ in csv.reader(handle)) - 1
              if rows != rows_expected: raise SystemExit(f"row mismatch {name}: {rows}")
              manifest["files"][name] = {"md5": digest, "rows": rows, "bytes": target.stat().st_size, "url": url}
          (out / "provenance.json").write_text(json.dumps(manifest, indent=2, sort_keys=True), encoding="utf-8")
          PY

      - name: Run chronological walk-forward optimization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, itertools, json, math, random, statistics
          from collections import Counter, defaultdict
          from datetime import datetime, timedelta, timezone, date
          from pathlib import Path

          ROOT = Path("tmp-research-data/hour-aware")
          TZ = timezone(timedelta(hours=8))
          INITIAL, TARGET, MAX_DD = 50.0, 2.0, 0.15
          COSTS = {"0pct_costless": 0.00, "2pct_round_trip": 0.02, "5pct_round_trip": 0.05}

          def iso(s): return datetime.fromisoformat(s.replace("Z", "+00:00"))
          def num(s, suffix): return float(s.strip().removesuffix(suffix).strip())

          raw = []
          with (ROOT / "trades.csv").open(newline="", encoding="utf-8-sig") as f:
              for r in csv.DictReader(f):
                  ex = iso(r["date"]); held = num(r["heldMin"], "min"); en = ex - timedelta(minutes=held)
                  raw.append({"entry": en, "exit": ex, "symbol": r["symbol"].strip(), "price": float(r["entryPrice"]),
                              "ret": num(r["pnl"], "%"), "sol": num(r["solIn"], "SOL")})

          groups = defaultdict(list)
          for r in raw:
              key = (r["symbol"], format(r["price"], ".16g"), int(round(r["entry"].timestamp()/10)))
              groups[key].append(r)
          episodes = []
          for g in groups.values():
              episodes.append({"entry": min(x["entry"] for x in g), "exit": max(x["exit"] for x in g),
                               "symbol": g[0]["symbol"], "ret": statistics.fmean(x["ret"] for x in g), "rows": len(g)})
          episodes.sort(key=lambda x: x["entry"])
          for e in episodes:
              local = e["entry"].astimezone(TZ); e["day"] = local.date(); e["hour"] = local.hour

          first = min(e["day"] for e in episodes); last = max(e["exit"].astimezone(TZ).date() for e in episodes)
          all_days = [first + timedelta(days=i) for i in range((last-first).days+1)]
          complete = all_days[1:-1]
          if len(complete) < 13: raise SystemExit(f"need >=13 complete days, found {len(complete)}")
          test_days = complete[3:]

          grid = list(itertools.product([.01,.02,.03,.04,.05], [.02,.03,.05], [2,3,4], [5,7], [0,1,2,3]))

          def blocked_hours(es, k):
              if not k: return ()
              h = defaultdict(list)
              for e in es: h[e["hour"]].append(e["ret"])
              ranked = []
              for hour, vals in h.items():
                  if len(vals) >= 4:
                      shrink = sum(vals)/(len(vals)+8)
                      if shrink < 0: ranked.append((shrink, -len(vals), hour))
              return tuple(x[2] for x in sorted(ranked)[:k])

          def simulate(es, days, p, cost, blocks):
              frac, cap, half_n, halt_n, _ = p
              equity = peak = INITIAL; dd = 0.; pnls=[]; daily=defaultdict(float); skipped=0; losses=0; current=None; day_start=INITIAL
              dayset=set(days)
              for e in es:
                  d=e["day"]
                  if d not in dayset: continue
                  if d != current:
                      current=d; losses=0; day_start=equity
                  if e["hour"] in blocks.get(d, ()): skipped+=1; continue
                  if daily[d] <= -cap*day_start or losses >= halt_n: skipped+=1; continue
                  size=equity*frac*(.5 if losses>=half_n else 1.)
                  pnl=size*max(-1., e["ret"]/100-cost)
                  equity += pnl; pnls.append(pnl); daily[d]+=pnl
                  losses = losses+1 if pnl<0 else 0
                  peak=max(peak,equity); dd=max(dd,(peak-equity)/peak if peak else 0)
              return {"final":equity,"net":equity-INITIAL,"dd":dd,"trades":len(pnls),"skipped":skipped,
                      "win":sum(x>0 for x in pnls)/len(pnls) if pnls else 0.,"pnls":pnls,
                      "daily":{d.isoformat():daily[d] for d in days}}

          def train_score(res, ndays, k):
              if res["trades"] < max(12, 2*ndays): return -1e9
              vals=list(res["daily"].values()); pos=sorted((x for x in res["pnls"] if x>0), reverse=True)
              robust=(res["net"]-sum(pos[:3]))/max(1,ndays)
              score=min(res["net"]/ndays, statistics.median(vals), robust)-max(0,res["dd"]-MAX_DD)*200-k*.01
              return score

          def walk(cost):
              chosen={}; blocks={}; log=[]
              for td in test_days:
                  train=[d for d in complete if d<td]; tes=[e for e in episodes if e["day"] in set(train)]
                  best=None
                  for p in grid:
                      bh=blocked_hours(tes,p[4]); bmap={d:bh for d in train}; r=simulate(tes,train,p,cost,bmap); s=train_score(r,len(train),p[4])
                      if best is None or s>best[0]: best=(s,p,bh,r)
                  s,p,bh,r=best; chosen[td]=p; blocks[td]=bh
                  log.append({"test_day":td.isoformat(),"score":s,"params":{"position_fraction":p[0],"daily_loss_cap":p[1],
                              "half_after_losses":p[2],"halt_after_losses":p[3],"blocked_hour_count":p[4]},
                              "blocked_hours_hkt":list(bh),"train_net":r["net"],"train_dd":r["dd"],"train_trades":r["trades"]})
              # Apply each day's independently selected parameters while carrying equity across days.
              equity=INITIAL; allpnls=[]; daily={}; dd=0.; peak=INITIAL; total_skipped=0; trades=0; wins=0
              for td in test_days:
                  p=chosen[td]; day_es=[e for e in episodes if e["day"]==td]
                  # day simulation rescaled to rolling equity; returns scale near-linearly at <=5% position size
                  r=simulate(day_es,[td],p,cost,{td:blocks[td]})
                  ratio=equity/INITIAL; dayp=r["net"]*ratio; equity+=dayp; daily[td.isoformat()]=dayp
                  scaled=[x*ratio for x in r["pnls"]]; allpnls+=scaled; trades+=r["trades"]; wins+=sum(x>0 for x in scaled); total_skipped+=r["skipped"]
                  peak=max(peak,equity); dd=max(dd,(peak-equity)/peak if peak else 0)
              net=equity-INITIAL; pos=sorted((x for x in allpnls if x>0),reverse=True)
              return {"test_days":[d.isoformat() for d in test_days],"day_count":len(test_days),"initial":INITIAL,"final":equity,
                      "net_profit":net,"average_daily_profit":net/len(test_days),"max_drawdown":dd,"completed_trades":trades,
                      "skipped_trades":total_skipped,"win_rate":wins/trades if trades else 0.,"net_without_top3_winners":net-sum(pos[:3]),
                      "daily_pnl":daily,"selection_log":log,
                      "target_met":len(test_days)>=10 and trades>=50 and net/len(test_days)>=TARGET and dd<=MAX_DD}

          def oracle(cost):
              es=[e for e in episodes if e["day"] in set(test_days)]; best=None
              for p in grid:
                  bh=blocked_hours(es,p[4]); r=simulate(es,test_days,p,cost,{d:bh for d in test_days})
                  score=r["net"] if r["dd"]<=MAX_DD and r["trades"]>=50 else -1e9
                  if best is None or score>best[0]: best=(score,p,bh,r)
              score,p,bh,r=best; target_total=TARGET*len(test_days); scale=target_total/r["net"] if r["net"]>0 else math.inf
              return {"warning":"hindsight upper bound, not predictive","params":{"position_fraction":p[0],"daily_loss_cap":p[1],
                      "half_after_losses":p[2],"halt_after_losses":p[3],"blocked_hour_count":p[4]},"blocked_hours_hkt":list(bh),
                      "net_profit":r["net"],"average_daily_profit":r["net"]/len(test_days),"max_drawdown":r["dd"],
                      "completed_trades":r["trades"],"required_linear_pnl_scaling_to_target":scale,
                      "implied_position_fraction":p[0]*scale if math.isfinite(scale) else None,"target_met":score>-1e8 and r["net"]>=target_total}

          def bootstrap(daily):
              vals=list(daily.values()); rng=random.Random(20260801); av=[]
              for _ in range(5000): av.append(statistics.fmean(rng.choice(vals) for _ in vals))
              av.sort(); q=lambda p:av[round(p*(len(av)-1))]
              return {"iterations":5000,"p05":q(.05),"p50":q(.5),"p95":q(.95),
                      "probability_average_daily_at_least_2_usd":sum(x>=TARGET for x in av)/len(av)}

          scenarios={}
          for name,cost in COSTS.items():
              wf=walk(cost); scenarios[name]={"cost_fraction":cost,"walk_forward":wf,"bootstrap":bootstrap(wf["daily_pnl"]),"hindsight_upper_bound":oracle(cost)}
          modes=Counter(json.dumps(x["params"],sort_keys=True) for x in scenarios["2pct_round_trip"]["walk_forward"]["selection_log"])
          overlay=json.loads(modes.most_common(1)[0][0])
          payload={"data":{"doi":"10.5281/zenodo.20043302","raw_rows":len(raw),"episodes":len(episodes),
                   "first_utc":min(e["entry"] for e in episodes).isoformat(),"last_utc":max(e["exit"] for e in episodes).isoformat(),
                   "complete_days_hkt":[d.isoformat() for d in complete],"raw_win_rate":sum(x["ret"]>0 for x in raw)/len(raw),
                   "episode_win_rate":sum(x["ret"]>0 for x in episodes)/len(episodes)},
                   "acceptance":{"initial_usd":INITIAL,"target_avg_daily_usd":TARGET,"min_oos_days":10,"min_trades":50,"max_drawdown":MAX_DD},
                   "methodology":{"walk_forward":True,"initial_train_days":3,"future_leakage":False,"partial_exit_reconstruction":"equal weighted",
                   "limitations":["source strategy is not the user's DBot entry engine","full candidate-universe minute bars are absent","exit reason is not used as an entry feature"]},
                   "scenarios":scenarios,"recommended_overlay":overlay,
                   "overall_target_met":all(x["walk_forward"]["target_met"] for x in scenarios.values())}
          out=ROOT/"results"; out.mkdir(exist_ok=True)
          (out/"walkforward-report.json").write_text(json.dumps(payload,indent=2,sort_keys=True))
          base=scenarios["2pct_round_trip"]["walk_forward"]
          md=f'''# Chronological 15-day public-data backtest\n\nThis tests risk controls on a checksum-validated executed-trade log; it does not claim to reproduce the user's DBot entry universe.\n\n- Raw exits: {len(raw)}\n- Reconstructed episodes: {len(episodes)}\n- Complete HKT days: {len(complete)}\n- Out-of-sample days: {base['day_count']}\n- Initial equity: $50\n- Requested target: $2 net per day\n\n## Base scenario: 2% round-trip execution cost\n\n- Net: ${base['net_profit']:.4f}\n- Average/day: ${base['average_daily_profit']:.4f}\n- Maximum drawdown: {base['max_drawdown']:.2%}\n- Trades: {base['completed_trades']}\n- Win rate: {base['win_rate']:.2%}\n- Net excluding top three winners: ${base['net_without_top3_winners']:.4f}\n- Target met: **{base['target_met']}**\n\nThe per-day parameter choice uses only earlier complete days. Hindsight results are labeled separately and are feasibility ceilings, not validation.\n'''
          (out/"walkforward-report.md").write_text(md)
          with (out/"oos-daily.csv").open("w",newline="") as f:
              w=csv.writer(f); w.writerow(["scenario","day_hkt","net_pnl_usd"])
              for n,s in scenarios.items():
                  for d,v in s["walk_forward"]["daily_pnl"].items(): w.writerow([n,d,f"{v:.10f}"])
          y=["# Paper-only overlay; requested profit target was not validated.","validated_target: false","mode: paper","risk:",
             f"  max_position_account_ratio: {overlay['position_fraction']:.4f}",f"  max_daily_loss_account_ratio: {overlay['daily_loss_cap']:.4f}",
             f"  consecutive_loss_halve_after: {overlay['half_after_losses']}",f"  consecutive_loss_halt_after: {overlay['halt_after_losses']}",
             "  max_open_positions: 5","  max_total_exposure_ratio: 0.1500","  adaptive_hour_gate:","    enabled: true",
             f"    max_blocked_hours: {overlay['blocked_hour_count']}","    minimum_prior_samples_per_hour: 4"]
          (out/"optimized-risk-overlay.yaml").write_text("\n".join(y)+"\n")
          print(json.dumps({n:{"net":s["walk_forward"]["net_profit"],"avg":s["walk_forward"]["average_daily_profit"],
                "dd":s["walk_forward"]["max_drawdown"],"trades":s["walk_forward"]["completed_trades"],"pass":s["walk_forward"]["target_met"]}
                for n,s in scenarios.items()},indent=2))
          PY

      - name: Commit validated data and research results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-research-data/hour-aware
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: add chronological 15-day walk-forward results"
          git push origin HEAD:tmp-hour-aware-data-fetch
