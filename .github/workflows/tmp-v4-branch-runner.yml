name: Temporary V5 walk-forward runner

on:
  pull_request:
    branches: [main]
    paths:
      - tmp-v3-data/v4_temporal_optimizer.py
      - tmp-v3-data/v5_walkforward_driver.py
      - .tmp-v5-trigger

permissions:
  contents: write

jobs:
  optimize:
    if: github.head_ref == 'tmp-dog-bot-v3-research'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - run: python -m pip install --disable-pip-version-check -q numpy pandas scikit-learn
      - name: Download corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v5 tmp-v3-data/v5-results
          curl -L --fail --retry 7 --retry-all-errors --connect-timeout 30 --max-time 600 -A 'dog-bot-v5-research/1.0' 'https://zenodo.org/records/21149176/files/rejection_outcomes.jsonl.gz?download=1' -o /tmp/v5/rejection_outcomes.jsonl.gz
          echo '38f7ffeb8a2d55a5b05e7d304cab11e5  /tmp/v5/rejection_outcomes.jsonl.gz' | md5sum -c -
      - name: Optimize
        id: optimize
        continue-on-error: true
        shell: bash
        run: PYTHONPATH=tmp-v3-data python tmp-v3-data/v5_walkforward_driver.py --corpus /tmp/v5/rejection_outcomes.jsonl.gz --output tmp-v3-data/v5-results > tmp-v3-data/v5-results/run.log 2>&1
      - name: Preserve results
        if: always()
        shell: bash
        run: |
          printf 'outcome=%s\nrun_id=%s\n' '${{ steps.optimize.outcome }}' '${{ github.run_id }}' > tmp-v3-data/v5-results/workflow-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp-v3-data/v5-results
          if ! git diff --cached --quiet; then git commit -m 'research: add V5 walk-forward output'; git push origin HEAD:tmp-dog-bot-v3-research; fi
      - if: steps.optimize.outcome != 'success'
        run: exit 1
