name: Temporary V6 artifact runner

on:
  pull_request:
    branches: [main]
    paths:
      - tmp-v3-data/v4_temporal_optimizer.py
      - tmp-v3-data/v6_shrinkage_driver.py
      - .tmp-v6-artifact-trigger

permissions:
  contents: read

jobs:
  optimize:
    if: github.head_ref == 'tmp-dog-bot-v3-research'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: python -m pip install --disable-pip-version-check -q numpy pandas scikit-learn
      - name: Download corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v6 tmp-v3-data/v6-artifact-results
          curl -L --fail --retry 7 --retry-all-errors --connect-timeout 30 --max-time 600 -A 'dog-bot-v6-artifact/1.0' 'https://zenodo.org/records/21149176/files/rejection_outcomes.jsonl.gz?download=1' -o /tmp/v6/rejection_outcomes.jsonl.gz
          echo '38f7ffeb8a2d55a5b05e7d304cab11e5  /tmp/v6/rejection_outcomes.jsonl.gz' | md5sum -c -
      - name: Optimize
        id: optimize
        continue-on-error: true
        shell: bash
        run: PYTHONPATH=tmp-v3-data python tmp-v3-data/v6_shrinkage_driver.py --corpus /tmp/v6/rejection_outcomes.jsonl.gz --output tmp-v3-data/v6-artifact-results > tmp-v3-data/v6-artifact-results/run-output.txt 2>&1
      - name: Upload compact result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6-shrinkage-results
          path: tmp-v3-data/v6-artifact-results
          if-no-files-found: error
          retention-days: 3
      - if: steps.optimize.outcome != 'success'
        run: exit 1
