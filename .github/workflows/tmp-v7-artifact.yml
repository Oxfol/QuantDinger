name: Temporary V7 research artifact
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'tmp-v3-data/**'
      - '.tmp-v7-*'
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: python -m pip install --disable-pip-version-check -q numpy pandas scikit-learn
      - name: Download verified corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v7 tmp-v3-data/v7-artifact
          curl -L --fail --retry 7 --retry-all-errors --connect-timeout 30 --max-time 600 -A 'dog-bot-v7-research/1.0' 'https://zenodo.org/records/21149176/files/rejection_outcomes.jsonl.gz?download=1' -o /tmp/v7/rejection_outcomes.jsonl.gz
          echo '38f7ffeb8a2d55a5b05e7d304cab11e5  /tmp/v7/rejection_outcomes.jsonl.gz' | md5sum -c -
      - name: Run V6 shrinkage baseline
        shell: bash
        run: PYTHONPATH=tmp-v3-data python tmp-v3-data/v6_shrinkage_driver.py --corpus /tmp/v7/rejection_outcomes.jsonl.gz --output tmp-v3-data/v7-artifact/v6
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: v7-research-results
          path: tmp-v3-data/v7-artifact
          retention-days: 3
