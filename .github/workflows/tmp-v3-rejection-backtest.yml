name: Temporary V3 rejection corpus backtest

on:
  push:
    branches: [tmp-dog-bot-v3-research]
    paths:
      - .github/workflows/tmp-v3-rejection-backtest.yml
      - .tmp-v3-backtest-trigger

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-dog-bot-v3-research

      - name: Restore reproducible research script
        shell: bash
        run: |
          mkdir -p /tmp/v3-research
          cat > /tmp/v3-research/script.b64 <<'B64'

B64
          base64 -d /tmp/v3-research/script.b64 | gzip -d > /tmp/v3-research/backtest.py
          python3 -m py_compile /tmp/v3-research/backtest.py

      - name: Run chronological optimizer and hard-gate test
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/v3-research/backtest.py --download --corpus /tmp/rejection_outcomes.jsonl.gz --output tmp-v3-data/backtest

      - name: Commit reproducible results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp-v3-data/backtest
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: add V3 rejection-corpus walk-forward result'
          git push origin HEAD:tmp-dog-bot-v3-research
